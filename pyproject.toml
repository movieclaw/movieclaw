[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movieclaw"
version = "0.20.0"
description = "Best-practice Python HTTP service template powered by FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MovieClaw" }
]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  # 库封面拼贴（氛围光货架，双端共用）与 Jellyfin 图片缩放（docs/design/jellyfin-compat.md 5.6）
  "pillow>=10.4.0,<12.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  # Discord Gateway 收消息用 websocket 客户端。此前经 uvicorn[standard] 传递
  # 引入,显式声明是因为代理支持(connect 的 proxy 参数)要求 >=14——
  # 传递依赖的版本不受我们控制,uvicorn 换实现或降版本会静默破坏代理配置
  "websockets>=14.0,<18.0",
  # [socks] extra：统一网络出口层支持 socks5 代理（NAS 玩家常见的翻墙形态）
  "httpx[socks]>=0.28.0,<1.0.0",
  "parsel>=1.9.0,<2.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "pyyaml>=6.0,<7.0",
  "sqlmodel>=0.0.22,<0.1.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "alembic>=1.13.0,<2.0.0",
  # SQLAlchemy 的 async 引擎依赖 greenlet；部分 Python 版本不会自动拉取，显式声明
  "greenlet>=3.0.0,<4.0.0",
  # 定时任务调度：进程内运行、复用现有 asyncio 事件循环（AsyncIOScheduler）。
  # 锁定 3.x —— 4.0 截至目前仍是 alpha 预发布，官方明确不建议用于生产。
  "apscheduler>=3.11.0,<4.0.0",
  # 敏感配置字段的落库加密：用 Fernet（AES-128-CBC + HMAC 的认证加密）保护
  # api_key/password/token 等密文，主密钥由 movieclaw_db.crypto 管理。
  "cryptography>=43.0.0,<46.0.0",
  # 每站请求限流：asyncio 原生漏桶（AsyncLimiter），对 PT 站点的"礼貌硬下限"。
  "aiolimiter>=1.2.0,<2.0.0",
  # 解析 multipart/form-data 上传（首页背景图上传接口 UploadFile 依赖它）。
  "python-multipart>=0.0.9,<1.0.0",
  # 管理员密码哈希：argon2 单向哈希（passlib 已停更，pwdlib 是其现代替代）。
  # 与 SecretBox 的分工：密码永不需要回显，存哈希而非可逆密文。
  "pwdlib[argon2]>=0.2.0,<1.0.0",
  # 登录会话令牌签名（HttpOnly Cookie 的内容）：Pallets 维护，Flask session 同款机制。
  "itsdangerous>=2.2.0,<3.0.0",
  # 媒体库实时监控（L4）：库根路径文件事件驱动增量扫描，替代大部分定期对账。
  "watchdog>=6.0.0,<7.0.0",
  # 下载服务层（movieclaw_downloader）的两个下载器客户端。均为同步 requests
  # 实现，适配器内用 asyncio.to_thread 包装成 async。
  # qbittorrent-api 用日历版本号（YYYY.M.PATCH），按年份上限约束。
  "qbittorrent-api>=2025.1.0,<2027.0.0",
  "transmission-rpc>=7.0.0,<8.0.0",
  # 微信绑定二维码：纯 Python 生成 SVG（不引 pillow），前端 <img> 直接渲染。
  "qrcode>=8.0,<9.0",
  # LLM 接入层（movieclaw_llm）：官方 openai SDK 作为唯一协议客户端，
  # 通过自定义 base_url 覆盖所有 OpenAI 兼容端点（含阿里云百炼 compatible-mode）。
  "openai>=2.45.0,<3.0.0",
  # 工具调用参数的 JSON Schema 校验：校验失败作为 tool result 回喂模型而非中断 agent loop。
  "jsonschema>=4.23.0,<5.0.0",
  # 种子名抽取小模型的推理三件套（movieclaw_enrich.inference）：
  # onnxruntime 跑 int8 模型（CPU 单条约 3ms），tokenizers 只做分词（比拖整个
  # transformers 轻两个数量级），模型文件本体从 GitHub Release 下载、不进包。
  "onnxruntime>=1.19,<2.0",
  "tokenizers>=0.20,<1.0",
  "numpy>=1.26,<3.0",
  # 中文标题的拼音首字母（媒体库海报墙的排序与 A-Z 快速定位）：纯 Python、
  # 无二进制依赖，自带姓氏/多音字词库，比自维护一张码点表准。
  "pypinyin>=0.53.0,<1.0.0",
  # 字幕服务（movieclaw_playback.subtitles，docs/design/jellyfin-subtitle.md §5）：
  # pysubs2 做格式解析与 srt↔vtt 转换（SubtitleEdit 的 Python 对应物）；
  # charset-normalizer 探测 GBK/BIG5 等中文编码后统一转 UTF-8 输出。
  "pysubs2>=1.7.0,<2.0.0",
  "charset-normalizer>=3.4.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  # CI 并行跑测试（-n auto --dist loadfile）：2900+ 用例串行要 9 分多钟，
  # 4 核并行压到 1/3 左右。dev 工具依赖，不进运行时，无需 bump runtime-version
  "pytest-xdist>=3.6.0,<4.0.0",
  # 锁小版本段：ruff 新版会带新规则，放宽上限会让 CI 门禁凭空变红
  "ruff>=0.16.0,<0.17.0",
]

[project.scripts]
movieclaw-api = "movieclaw_api.main:run"
# mclaw 不在这里：CLI 是独立的 Go 二进制（cli/），随 Release 分发，
# 装它不再需要 Python 环境（docs/design/cli-go-migration.md）。

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 基线 spec：构建期由 movieclaw_api.export_openapi 现场导出。服务端运行期读它
# 渲染 Agent 的 mclaw 工具描述，Go CLI 在自己的构建期把同一份嵌进二进制。
movieclaw_api = ["data/spec.json"]
# 内置技能层（docs/design/agent-skills.md）：Docker 部署整棵 src 拷贝本就带上，
# 这行给 wheel 形态兜底。
movieclaw_agent = ["builtin-skills/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: 依赖真实网络或 cookie 的集成测试，CI 中可用 -m 'not integration' 跳过",
  "real_password_hash: 使用生产 Argon2 参数的专项测试，不启用低成本测试 hasher",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ml/ 是离线训练脚本（不随服务部署、不进运行时），不作为合并门禁的检查对象；
# builtin-skills/ 是内置 Agent 技能（含第三方原样引入的脚本，如 Anthropic 的
# skill-creator），是数据不是本项目代码，保持原封不动、不做风格检查
extend-exclude = ["ml", "src/movieclaw_agent/builtin-skills"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

# 系统提示词文件：提示词正文的自然段落不按代码行宽折行（折行会改变提示词内容）
[tool.ruff.lint.per-file-ignores]
"src/movieclaw_agent/prompts.py" = ["E501"]

# FastAPI 的 Depends()/Query() 等必须写在参数默认值里，这是官方推荐用法，
# 因此把它们标记为"不可变调用"，豁免 B008（函数调用不应出现在默认值）告警。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.File",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
