function preselect(){S.checked=new Set();for(const it of S.items)if(!it.skip)for(const u of it.units)for(const f of u.files)if(isRedundant(f)&&inPolicy(f.cat))S.checked.add(f.id);}
function isRedundant(f){return !!f.cat&&f.cat!=='undecidable'&&!f.kept&&!f.pass;}
function inPolicy(cat){return cat==='same_inode'||cat==='same_content'||cat==='same_tier'||(S.policy==='best_only'&&cat==='lower_tier');}
preselect();

const fmt=n=>n.toLocaleString('zh-CN');
const gb=s=>parseFloat(s)||0;
function allFiles(){const a=[];for(const it of S.items)for(const u of it.units)for(const f of u.files)a.push({it,u,f});return a;}
function fileById(id){return allFiles().find(x=>x.f.id===id);}
function stats(){
  let red=0,bytes=0,coex=0,kept=0,und=0,units=0;const bycat={};
  for(const {it,u,f} of allFiles()){
    if(f.kept){kept++;continue;}
    if(it.skip||!f.cat)continue;
    if(f.cat==='undecidable'){und++;bycat.undecidable=(bycat.undecidable||0)+1;continue;}
    bycat[f.cat]=(bycat[f.cat]||0)+1;
    if(inPolicy(f.cat)){red++;bytes+=gb(f.sz);}else coex++;
  }
  for(const it of S.items)if(!it.skip)for(const u of it.units)if(u.files.some(f=>isRedundant(f)&&inPolicy(f.cat)))units++;
  return {red,bytes,coex,kept,und,units,bycat};
}

  const pol=main.querySelector('#policy');if(pol)pol.onchange=()=>{if(pol.value==='best_only'){S.modal={type:'policy'};render();}else{S.policy='safe';preselect();render();}};
  q('[data-policy-ok]').forEach(b=>b.onclick=()=>{S.policy='best_only';S.modal=null;preselect();render();toast('已切换到「只留最优」，<b>低档版本已预勾</b>，可逐个取消');});
  q('[data-close]').forEach(b=>b.onclick=()=>{S.modal=null;render();});
  q('#clean,#clean2').forEach(b=>b.onclick=()=>{S.modal={type:'confirm'};render();});
  const un=main.querySelector('#uncheck');if(un)un.onclick=()=>{S.checked.clear();render();};
  q('[data-confirm]').forEach(b=>b.onclick=()=>{
    const ids=[...S.checked];let n=0;
    for(const id of ids){const {it,u}=unitOf(id);const f=u.files.find(x=>x.id===id);const keep=u.files.find(x=>x.role==='keep');
      const note=f.cat==='same_inode'?`与「${keep.name}」是同一文件，已保留后者`:f.cat==='same_content'?`与「${keep.name}」内容相同，已保留后者`:f.cat==='same_tier'?`与「${keep.name}」同档（${f.q}），已保留后者`:`低于「${keep.name}」（${f.q} < ${keep.q}）`;
      u.files=u.files.filter(x=>x.id!==id);S.recycle.unshift({it,u,f,note});n++;}
    S.checked.clear();S.modal=null;S.tab='dup';render();toast(`<b>已移入回收站 ${n} 个文件</b> · 7 天内可在回收站恢复`);
  });
  q('[data-swap]').forEach(b=>b.onclick=()=>{const id=+b.dataset.swap;const {u}=unitOf(id);const f=u.files.find(x=>x.id===id);const k=u.files.find(x=>x.role==='keep');
    const cat=f.cat,uwhy=f.uwhy;f.role='keep';delete f.cat;delete f.uwhy;k.role=undefined;k.cat=cat;k.uwhy=uwhy;k.ref=f.id;S.checked.delete(id);if(isRedundant(k)&&inPolicy(cat))S.checked.add(k.id);render();toast('已改为保留这个文件，另一个转为冗余');});
  q('[data-keep]').forEach(b=>b.onclick=()=>{const id=+b.dataset.keep;const x=fileById(id);x.f.kept='2026-09-13';S.checked.delete(id);S.menu=null;render();toast('<b>已标记「刻意保留」</b>，以后不再列为冗余；可在「已标记保留」里取消');});
  q('[data-unkeep]').forEach(b=>b.onclick=()=>{const id=+b.dataset.unkeep;const x=fileById(id);delete x.f.kept;S.menu=null;if(isRedundant(x.f)&&inPolicy(x.f.cat))S.checked.add(id);render();toast('已取消标记，重新参与冗余判定');});
  q('[data-annot]').forEach(b=>b.onclick=()=>{S.modal={type:'annot'};render();});
  q('[data-restore]').forEach(b=>b.onclick=()=>{const id=+b.dataset.restore;const i=S.recycle.findIndex(r=>r.f.id===id);const r=S.recycle.splice(i,1)[0];r.u.files.push(r.f);if(isRedundant(r.f)&&inPolicy(r.f.cat))S.checked.add(r.f.id);render();toast('<b>已恢复</b>到原位置；它会重新出现在「重复文件」里');});
  const back=main.querySelector('#back');if(back)back.onclick=()=>{S.screen='manage';render();};
  q('[data-dopen]').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;const id=+r.dataset.dopen;S.detailOpen.has(id)?S.detailOpen.delete(id):S.detailOpen.add(id);render();});
  q('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.menu;S.menu=S.menu===id?null:id;render();});
  const idup=main.querySelector('#itemdup');if(idup)idup.onclick=()=>{S.modal={type:'itemdup'};render();};
  q('[data-goto-manage]').forEach(b=>b.onclick=()=>{S.modal=null;S.screen='manage';S.tab='dup';setStep(4);});
}
setStep(1);
})();
</script>
