# MovieClaw iOS 工程定义（XcodeGen）。
#
# 为什么用 XcodeGen 而不是直接提交 .xcodeproj：
# - .pbxproj 是机器生成的巨型文件，多人/多会话并行加文件时几乎必然冲突；
# - 这里按目录收录源码，新增 Swift 文件无需改工程文件，重新 `xcodegen` 即可。
# 生成：cd ios/MovieClaw && xcodegen generate（产物 MovieClaw.xcodeproj 已在 .gitignore）
name: MovieClaw
options:
  bundleIdPrefix: io.movieclaw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  # 图片加载与缓存（MIT）：海报墙的解码降采样、内存/磁盘缓存、预取
  Nuke:
    url: https://github.com/kean/Nuke
    from: "13.0.0"
  # libmpv 播放引擎（LGPL 构建）：MKV/HEVC/TrueHD/DTS 直出、ASS/PGS 由 libass 渲染。
  # 用仓库内的精简版 MPVKit（Vendor/MPVKit）：只含 LGPL 产品，libmpv 打了尺寸自检补丁
  # （旋转屏幕时 mpv 下一帧即按新尺寸出图），其余二进制仍引用上游 1.0.0 发布包。
  # 绝不能换成 `MPVKit-GPL`（GPL 会传染整个 App 的许可）。
  MPVKit:
    path: Vendor/MPVKit
configFiles:
  # 开发者团队从本机 Signing.local.xcconfig 读（不入库），见 XcodeConfig/Signing.xcconfig
  Debug: XcodeConfig/Signing.xcconfig
  Release: XcodeConfig/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2 起的「易上手并发」：默认主线程隔离，UI 代码不必处处标 @MainActor
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MovieClaw:
    type: application
    platform: iOS
    sources:
      - path: MovieClaw
        type: syncedFolder
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      # libmpv 经 MPVCore 动态框架间接引入（LGPL 合规，见下方 MPVCore 目标的说明）
      - target: MPVCore
    info:
      path: MovieClaw/Info.plist
      properties:
        CFBundleDisplayName: MovieClaw
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # App 固定暗色：底色纯黑（同 Apple Music），启动屏与系统弹出的界面也跟着是暗色，不会先白屏一下
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 自托管服务器绝大多数是局域网 http 直连（如 http://192.168.1.10:3000），
        # 必须放开 ATS 才能访问；公网 https 部署不受影响。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: MovieClaw 需要访问局域网内你自己部署的 MovieClaw 服务器。
        NSPhotoLibraryUsageDescription: 选择图片作为头像、媒体库封面或 AI 会话附件。
        NSCameraUsageDescription: 拍照作为 AI 会话的图片附件。
        # 后台继续播放音频、画中画
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.movieclaw.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # libmpv / FFmpeg 的动态框架边界。
  # MPVKit 发布的是静态 xcframework，直接链进 App 等于把 LGPL 库静态链接进主程序；
  # 收进这个动态框架后，用户可以用自行编译的同名框架替换（LGPL 2.1 §6）。
  # App 只 import MPVCore，不得直接依赖 MPVKit。
  MPVCore:
    type: framework
    platform: iOS
    sources:
      - path: MPVCore
        type: syncedFolder
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.movieclaw.mpvcore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # OpenGL ES / GLKit 在 iOS 上已标记废弃，但仍是模拟器上唯一可用的 mpv 渲染路径
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO
  MovieClawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MovieClawTests
        type: syncedFolder
    dependencies:
      - target: MovieClaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MovieClawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MovieClawUITests
        type: syncedFolder
    dependencies:
      - target: MovieClaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MovieClaw
        # XCTestCase 的初始化器是非隔离的，测试类不能继承工程级的默认主线程隔离
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  MovieClaw:
    build:
      targets:
        MovieClaw: all
        MovieClawTests: [test]
    test:
      targets:
        - MovieClawTests
        - MovieClawUITests
