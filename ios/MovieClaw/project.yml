# MovieClaw iOS 工程定义（XcodeGen）。
#
# 为什么用 XcodeGen 而不是直接提交 .xcodeproj：
# - .pbxproj 是机器生成的巨型文件，多人/多会话并行加文件时几乎必然冲突；
# - 这里按目录收录源码，新增 Swift 文件无需改工程文件，重新 `xcodegen` 即可。
# 生成：cd ios/MovieClaw && xcodegen generate（产物 MovieClaw.xcodeproj 已在 .gitignore）
name: MovieClaw
options:
  bundleIdPrefix: com.movieclaw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2 起的「易上手并发」：默认主线程隔离，UI 代码不必处处标 @MainActor
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MovieClaw:
    type: application
    platform: iOS
    sources:
      - path: MovieClaw
    info:
      path: MovieClaw/Info.plist
      properties:
        CFBundleDisplayName: MovieClaw
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 自托管服务器绝大多数是局域网 http 直连（如 http://192.168.1.10:3000），
        # 必须放开 ATS 才能访问；公网 https 部署不受影响。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: MovieClaw 需要访问局域网内你自己部署的 MovieClaw 服务器。
        NSPhotoLibraryUsageDescription: 选择图片作为头像。
        # 后台继续播放音频、画中画
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.movieclaw.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  MovieClawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MovieClawTests
    dependencies:
      - target: MovieClaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MovieClawUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MovieClawUITests
    dependencies:
      - target: MovieClaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MovieClaw
        # XCTestCase 的初始化器是非隔离的，测试类不能继承工程级的默认主线程隔离
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  MovieClaw:
    build:
      targets:
        MovieClaw: all
        MovieClawTests: [test]
    test:
      targets:
        - MovieClawTests
        - MovieClawUITests
