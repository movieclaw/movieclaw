# =============================================================================
# 合并门禁 CI（CLAUDE.md「合并前必须通过」四件套的自动化）
#
# 此前 pytest / ruff / web:lint / web:typecheck 全靠本地自觉，外部贡献 PR
# 没有任何机器把关。本工作流把四条门禁固化到 CI：
#
#   - python 作业：ruff check . + pytest（跳过 integration 标记的用例）。
#     enrich 的片名/季集抽取依赖 NER 模型（运行期数据，不入 git），缺模型时
#     季集相关的一批测试会稳定失败——所以先从模型 Release 下载三个文件，
#     并用 actions/cache 按 tag 缓存，避免每次跑 CI 都拉 15MB。
#   - web 作业：eslint + tsc，与 release.yml 的前端环境保持同一套版本。
#   - cli-go 作业：mclaw（Go）的 vet、gofmt、单测与六平台交叉编译。命令树
#     快照、豁免端点清单、域帮助覆盖这些命令面守护全在 go test 里，改了路由
#     忘了同步会在这里红。
#   - worker-macos 作业：macOS Worker 的 Swift 构建与单测。它只能在 macOS
#     runner 上编译，本地 Linux 开发机和容器都跑不了，因此这里是它唯一的
#     机器把关。刻意不加 paths 过滤：被设为必需检查的作业一旦因路径过滤
#     不运行，PR 会永远等在「检查未完成」上；本仓库是公开仓库，macOS
#     runner 分钟数不计费，多跑几次换一个稳定的门禁是划算的。
# =============================================================================
name: ci

on:
  pull_request:
  push:
    branches: [main]

# NER 模型的 Release tag；模型发新版时同步改这里（发版流程见 .claude/skills/release）
env:
  NER_MODEL_TAG: torrent-ner-v3

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（含 dev 工具链）
        run: pip install -e ".[dev]"

      - name: 恢复 NER 模型缓存
        id: ner-cache
        uses: actions/cache@v4
        with:
          path: data/models/torrent-ner
          key: ner-model-${{ env.NER_MODEL_TAG }}

      - name: 下载 NER 模型（缓存未命中时）
        if: steps.ner-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$NER_MODEL_TAG" \
            --repo "${{ github.repository }}" \
            --dir data/models/torrent-ner

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest -q -m "not integration"

  cli-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: gofmt
        working-directory: cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: cli
        run: go vet ./...

      # 跨语言 spec 指纹比对要用服务端的 export_openapi，先把 Python 侧准备好
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装服务端依赖（跨语言指纹比对用）
        run: pip install -e .

      - name: go test
        working-directory: cli
        run: go test ./...

      # 六个分发目标都得编得过：任何一个挂了，那批用户就装不上
      # （目标清单与 cli/.goreleaser.yaml 的 goos × goarch 保持一致）
      - name: 交叉编译六平台
        working-directory: cli
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -o /tmp/mclaw-check ./cmd/mclaw
            echo "✓ $target"
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json 未声明 packageManager，须显式给版本（与 release.yml 一致）
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm web:lint

      - name: typecheck
        run: pnpm web:typecheck

  # macOS Worker 的构建门禁。开发者多数在 Linux/容器里改代码，Swift 侧的
  # 编译错误在本地完全暴露不出来，只能靠这里拦。
  worker-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 输出工具链版本（排障时先看这行）
        run: swift --version

      - name: 构建
        run: swift build --package-path macos/MovieClawTranscoder -c release

      - name: 单测
        run: swift test --package-path macos/MovieClawTranscoder
