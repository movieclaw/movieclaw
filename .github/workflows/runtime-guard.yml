# =============================================================================
# runtime-version 守卫（docs/design/in-app-update.md M5）
#
# 应用内更新的兼容契约依赖 docker/runtime-version 诚实反映运行时依赖：
# PR 改了 pyproject 的 dependencies、Dockerfile 的系统包/基础镜像，却没
# bump runtime-version，就会出现「旧镜像装上依赖不满足的新代码」的事故。
# 本守卫在 CI 拦下这种遗漏。
#
# 监控范围必须覆盖**所有只存在于镜像里、不随应用包发布的文件**。判据很简单：
# 文件是被 Dockerfile COPY 进镜像的，而 scripts/build-release-artifacts.sh
# 打的应用包里没有它——那么老镜像做应用内更新时拿不到这个文件的新版本。
# nginx.conf.template 与 entrypoint.sh 都属于这一类：#229 给前者加了
# WebSocket 转发规则却没 bump，老镜像用户更新后远程转码 Worker 的 WS 握手
# 会静默 404，因为他们镜像里的 nginx 仍是旧模板。
# =============================================================================
name: runtime-guard

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "Dockerfile"
      - "docker/runtime-version"
      - "docker/nginx.conf.template"
      - "docker/entrypoint.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 runtime-version 是否随依赖变化 bump
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"

          # pyproject 的 dependencies 数组是否有实质变化（注释/格式不算）
          python3 - "$BASE" <<'PY'
          import subprocess, sys, tomllib

          def deps(ref: str | None):
              raw = (
                  subprocess.check_output(["git", "show", f"{ref}:pyproject.toml"])
                  if ref
                  else open("pyproject.toml", "rb").read()
              )
              return sorted(tomllib.loads(raw.decode())["project"]["dependencies"])

          changed = deps(sys.argv[1]) != deps(None)
          open("deps_changed", "w").write("1" if changed else "0")
          PY

          # Dockerfile 的系统包安装/基础镜像是否变化
          docker_changed=$(git diff "$BASE"...HEAD -- Dockerfile \
            | grep -cE '^[+-].*apt-get install|^[+-]FROM ' || true)
          # 只存在于镜像里的文件是否变化：它们不随应用包发布，老镜像做应用内
          # 更新时拿不到新版本，任何改动都必须跟一次镜像发布
          image_only_changed=$(git diff --name-only "$BASE"...HEAD -- \
            docker/nginx.conf.template docker/entrypoint.sh | wc -l)
          rv_changed=$(git diff "$BASE"...HEAD -- docker/runtime-version \
            | grep -cE '^[+-][0-9]' || true)

          if { [ "$(cat deps_changed)" = "1" ] || [ "$docker_changed" -gt 0 ] \
                || [ "$image_only_changed" -gt 0 ]; } \
              && [ "$rv_changed" -eq 0 ]; then
            echo "::error::检测到运行时契约变化（pyproject dependencies、Dockerfile 的系统包/基础镜像，或 nginx.conf.template / entrypoint.sh 这类只存在于镜像里的文件），但 docker/runtime-version 未 bump。旧镜像的应用内更新拿不到这些改动，会表现为启动失败或功能静默失效——请把 docker/runtime-version +1，并在合并后发布新镜像。若确认本次变化向后兼容（如仅放宽版本上限、仅改注释），可由维护者说明后跳过本检查。"
            exit 1
          fi
          echo "runtime-version 契约检查通过"
