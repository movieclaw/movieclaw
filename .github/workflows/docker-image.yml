# =============================================================================
# Docker 镜像发布流水线
#
# 在 GitHub amd64 runner 上构建 linux/amd64 镜像，并推送到 Docker Hub
#（docker.io/<DOCKERHUB_USERNAME>/movieclaw）。
#
# 三个入口：
#   1. main 分支每次推送后自动构建，发布 latest + sha-<短提交号>；
#   2. release.yml 在发版产物构建成功后自动调用（workflow_call）——
#      每次应用发版都会同步发布同版本号的镜像
#   3. 手动触发（Actions → docker-image → Run workflow）——补发或
#      单独发镜像时用
#
# 标签策略：正式版打 <tag> + runtime-N + latest 三个标签；
# 预发布版（tag 含 "-"，如 v0.3.0-beta.1）只打 <tag>，不动 latest，
# 避免 beta 被 docker pull 默认拉到。
#
# 依赖的仓库配置（Settings → Secrets and variables → Actions）：
#   变量  DOCKERHUB_USERNAME  Docker Hub 用户名（镜像命名空间）
#   机密  DOCKERHUB_TOKEN     Docker Hub 访问令牌（Read & Write 权限）
#   机密  TMDB_API_KEY        烧进镜像的默认 TMDB Key
# =============================================================================
name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 v0.2.0，一般与当时的应用版本一致）"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "镜像标签（与应用 Release tag 一致）"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/movieclaw

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: metadata
        run: |
          RELEASE_TAG="${{ inputs.tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            # main 自动构建：latest 给 compose 默认拉取，sha 标签用于精确回滚。
            SHORT_SHA="${GITHUB_SHA::12}"
            PUBLISH_TAG="sha-$SHORT_SHA"
            TAGS="$IMAGE:$PUBLISH_TAG"$'\n'"$IMAGE:latest"
          else
            PUBLISH_TAG="$RELEASE_TAG"
            TAGS="$IMAGE:$RELEASE_TAG"
            # 预发布（tag 含 "-"）只打版本号标签，不推 latest / runtime-N
            case "$RELEASE_TAG" in
              *-*) ;;
              *)
                RUNTIME="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/docker/runtime-version")"
                TAGS+=$'\n'"$IMAGE:runtime-$RUNTIME"$'\n'"$IMAGE:latest"
                ;;
            esac
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "publish_tag=$PUBLISH_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Next.js 构建的并行 worker 靠 /dev/shm 通信，默认 64MB 会静默死锁
          shm-size: 2g
          build-args: |
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}

      - name: 检查推送结果
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.metadata.outputs.publish_tag }}"
